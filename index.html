<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KASA PRO" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>KASA PRO V19 · BY İLHAN EŞİN</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f7fb}
    body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    #root{min-height:100vh}
    .boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;color:#334155;font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    .boot-error{min-height:100vh;padding:32px;box-sizing:border-box;color:#991b1b;font:16px system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff}
  </style>
</head>
<body>
  <div id="root"><div class="boot-fallback">KASA PRO başlatılıyor...</div></div>
  <script>
    window.__KASA_PRO_BOOTED__ = false;
    function showBootError(message){
      if(window.__KASA_PRO_BOOTED__) return;
      var root=document.getElementById('root');
      if(root) root.innerHTML='<div class="boot-error"><h2>KASA PRO başlatılamadı</h2><p>'+String(message||'Bilinmeyen JavaScript hatası')+'</p><p>Bu mesaj gerçek tarayıcı hatasını gösterir; ekran artık sessizce beyaz kalmaz.</p><button onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer">Sayfayı yenile</button></div>';
    }
    window.addEventListener('error', function(e){ showBootError(e.message || 'JavaScript yükleme hatası'); });
    window.addEventListener('unhandledrejection', function(e){ showBootError(e.reason && e.reason.message ? e.reason.message : e.reason); });
    if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){}); }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
